# Baut die App bei jedem Push auf main und veröffentlicht sie auf GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Einmal pro Woche neu bauen, damit Kometen, Exoplaneten und Sondenbahnen aktuell bleiben
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Daten von NASA/JPL auffrischen; bei Netzproblemen bleiben die Dateien aus dem Repo
      - run: npm run data
        timeout-minutes: 10
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
